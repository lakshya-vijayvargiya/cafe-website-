<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | The Bidholi Corner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { espresso: '#2A1A10', roast: '#4E3220', rust: '#B4602A', beige: '#D7CCC8', cream: '#FBF6EC', softCream: '#F1E4CC', gold: '#CE9E5E' }, fontFamily: { serif: ['Fraunces', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-[#FBF6EC] text-[#2A1A10] font-sans antialiased pt-20">

    <header class="fixed top-0 left-0 right-0 z-50 bg-[#2A1A10]/95 backdrop-blur-md border-b border-[#CE9E5E]/20">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-20">
            <a href="index.html" class="flex items-center gap-3">
                <i class="fa-solid fa-mug-hot text-[#B4602A] text-xl"></i>
                <span class="font-serif text-2xl font-bold text-white">The Bidholi Corner</span>
            </a>
            <nav class="hidden md:flex items-center space-x-8">
                <a href="index.html" class="text-white hover:text-[#CE9E5E] text-sm font-medium transition-colors">Home</a>
                <a href="about.html" class="text-white hover:text-[#CE9E5E] text-sm font-medium transition-colors">About Us</a>
                <a href="menu.html" class="text-white hover:text-[#CE9E5E] text-sm font-medium transition-colors">Menu</a>
                <a href="gallery.html" class="text-[#CE9E5E] text-sm font-medium">Gallery</a>
                <a href="contact.html" class="text-white hover:text-[#CE9E5E] text-sm font-medium transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <main class="py-16 max-w-7xl mx-auto px-4">
        <div class="text-center mb-12">
            <span class="text-[#B4602A] font-serif italic text-lg">A Peek Inside</span>
            <h1 class="font-serif text-4xl sm:text-5xl font-bold text-[#2A1A10] mt-2">Café Gallery & Ambience</h1>
            <p class="text-[#4E3220] mt-2">A glimpse of our cozy corners, freshly brewed coffees, and delicious food.</p>
        </div>

        <!-- Gallery Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="overflow-hidden rounded-2xl shadow-md h-72">
                <img src="https://images.unsplash.com/photo-1521017432531-fbd92d768814?auto=format&fit=crop&w=800&q=80" alt="Café Ambience" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
            </div>
            <div class="overflow-hidden rounded-2xl shadow-md h-72">
                <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=80" alt="Coffee Cup" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
            </div>
            <div class="overflow-hidden rounded-2xl shadow-md h-72">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=80" alt="Pizza" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
            </div>
            <div class="overflow-hidden rounded-2xl shadow-md h-72">
                <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=800&q=80" alt="Seating Corner" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
            </div>
            <div class="overflow-hidden rounded-2xl shadow-md h-72">
                <img src="https://images.unsplash.com/photo-1621996346565-e3d5d6281298?auto=format&fit=crop&w=800&q=80" alt="Pasta" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
            </div>
            <div class="overflow-hidden rounded-2xl shadow-md h-72">
                <img src="https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=800&q=80" alt="Iced Tea" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
            </div>
        </div>
    </main>

    <footer class="bg-[#2A1A10] text-white pt-12 pb-8 border-t border-[#CE9E5E]/20 mt-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>© 2026 The Bidholi Corner. A Code Minds Project.</p>
        </div>
    </footer>
</body>
</html>
